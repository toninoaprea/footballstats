name: Aggiorna dati

on:
  schedule:
    - cron: '17 5 * * *'   # ogni giorno alle 7:17 (ora italiana estiva)
  workflow_dispatch:        # permette di avviarlo a mano dalla scheda Actions

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/scarica_dati.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Aggiornamento dati partite" && git push)
